name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # These are Serel Memory's own framework-integrity checks. They are meaningless in
    # a downstream project created via `npx degit` (which has its own workflows and
    # memory bank), so the job self-disables outside the canonical repo. Downstream
    # users can safely delete .github/ after install.
    if: github.repository == 'madeordinary/serel-memory'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Pinned ShellCheck and all framework suites
        run: bash tests/ci.sh checks

  docs:
    # Markdown hygiene for the prompt files themselves. Same repo guard as above —
    # downstream projects own their docs and shouldn't inherit these checks.
    if: github.repository == 'madeordinary/serel-memory'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci/node-version
          package-manager-cache: false

      - name: Locked Markdown lint
        run: bash tests/ci.sh docs

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
